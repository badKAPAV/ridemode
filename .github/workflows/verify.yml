name: Verify scaffold and Android starter
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Documentation contracts
        run: bash scripts/verify-docs.sh
      - name: Android unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
